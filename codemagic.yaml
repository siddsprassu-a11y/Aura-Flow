workflows:
  android-workflow:
    name: Android Build

    environment:
      node: latest

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Give execute permission
        script: |
          chmod +x node_modules/.bin/cap
          chmod +x android/gradlew

      - name: Sync Capacitor
        script: |
          npx cap sync android

      - name: Build APK
        script: |
          cd android
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk